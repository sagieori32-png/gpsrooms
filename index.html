<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>מצפן עו״ס הר הצופים</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Hebrew:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Secular+One&display=swap">
<style>
/* Layout: single-column wayfinding app, phone-first; signage plates for rooms, grouped by building */
:root{
  --bg:#f3f5f6; --surface:#ffffff; --fg:#14232b; --muted:#5a6b74; --line:#d6dde1;
  --sign:#0f4c5c; --sign-fg:#ffffff; --amber:#f2b134; --amber-ink:#3a2800;
  --ok:#2e7d4f; --warn:#a15c00;
  --display:"Secular One","IBM Plex Sans Hebrew",Arial,sans-serif;
  --body:"IBM Plex Sans Hebrew","IBM Plex Sans Arabic","Segoe UI",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e171c; --surface:#16232a; --fg:#e6edf0; --muted:#97a8b0; --line:#2a3a42;
  --sign:#1d6f84; --sign-fg:#ffffff; --amber:#f2b134; --amber-ink:#2b1e00;
  --ok:#5cc28a; --warn:#e5a54a; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0e171c; --surface:#16232a; --fg:#e6edf0; --muted:#97a8b0; --line:#2a3a42;
  --sign:#1d6f84; --sign-fg:#ffffff; --amber:#f2b134; --amber-ink:#2b1e00;
  --ok:#5cc28a; --warn:#e5a54a; color-scheme:dark }

*{box-sizing:border-box}
[hidden]{display:none!important}
.a11y{display:flex;align-items:center;gap:10px;width:100%;border:2px solid var(--sign);background:var(--surface);color:var(--fg);border-radius:12px;padding:10px 14px;font:600 1rem var(--body);cursor:pointer;text-align:start}
.a11y svg{width:26px;height:26px;flex:none}
.a11y .sw{margin-inline-start:auto;width:42px;height:24px;border-radius:12px;background:var(--line);position:relative;flex:none}
.a11y .sw::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:18px;height:18px;border-radius:50%;background:var(--surface);transition:inset-inline-start .15s}
.a11y[aria-pressed="true"]{background:var(--sign);color:var(--sign-fg)}
.a11y[aria-pressed="true"] .sw{background:var(--amber)}
.a11y[aria-pressed="true"] .sw::after{inset-inline-start:21px;background:var(--amber-ink)}
.a11y:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.acc-on{border-inline-start:4px solid var(--sign);background:var(--surface);border-radius:8px;padding:8px 12px;font-size:.9rem}
.badge-acc{font-weight:600;color:var(--ok)}
.badge-noacc{color:var(--warn)}
body{background:var(--bg);color:var(--fg);font:1rem/1.6 var(--body)}
.wrap:lang(ar){font-family:"IBM Plex Sans Arabic","Segoe UI",Arial,sans-serif}
.wrap:lang(ar) h1,.wrap:lang(ar) h2,.wrap:lang(ar) h3{font-family:"IBM Plex Sans Arabic",Arial,sans-serif;font-weight:600}
.top-tools{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:none}
.langs{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--surface)}
.lang{appearance:none;border:0;background:none;color:var(--fg);font:600 .8rem var(--body);padding:5px 10px;cursor:pointer;min-width:38px}
.lang:lang(ar){font-family:"IBM Plex Sans Arabic",Arial,sans-serif}
.lang[aria-pressed="true"]{background:var(--sign);color:var(--sign-fg)}
.lang:focus-visible{outline:3px solid var(--amber);outline-offset:-3px}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:20px 48px;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--display);font-weight:400;line-height:1.2;text-wrap:balance;margin:0}
h1{font-size:1.75rem} h2{font-size:1.35rem} h3{font-size:1.05rem}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:.875rem}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px}
.brand-mark{width:40px;height:40px;border-radius:8px;background:var(--sign);display:grid;place-items:center;flex:none}
.brand-mark svg{width:24px;height:24px}
.linkbtn{background:none;border:0;color:var(--sign);font:inherit;font-size:.875rem;text-decoration:underline;cursor:pointer;padding:4px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .linkbtn{color:var(--fg)}}
:root[data-theme="dark"] .linkbtn{color:var(--fg)}

.note{background:var(--amber);color:var(--amber-ink);border-radius:8px;padding:8px 12px;font-size:.875rem;font-weight:500}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:14px}
.check{display:flex;gap:10px;align-items:flex-start}
.check input{width:20px;height:20px;margin-top:3px;flex:none;accent-color:var(--sign)}
ul.plain{margin:0;padding-inline-start:20px;display:flex;flex-direction:column;gap:6px}

.btn{appearance:none;border:0;border-radius:10px;padding:13px 16px;font:600 1rem var(--body);cursor:pointer;text-align:center;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn-primary{background:var(--sign);color:var(--sign-fg)}
.btn-primary[disabled]{opacity:.45;cursor:not-allowed}
.btn-ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.btn:focus-visible,.linkbtn:focus-visible,.room:focus-visible,input:focus-visible,select:focus-visible,.chip:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>.btn{flex:1 1 180px}

.search{width:100%;padding:13px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:inherit}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:6px 12px;font:500 .85rem var(--body);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--sign);border-color:var(--sign);color:var(--sign-fg)}

.group{display:flex;flex-direction:column;gap:8px}
.group-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px;padding-top:6px}
.group-h h3{font-size:1rem}
.count{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.room{display:flex;align-items:center;gap:14px;width:100%;text-align:start;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;color:var(--fg);font:inherit;cursor:pointer}
.room:hover{border-color:var(--sign)}
.room .meta{display:flex;flex-direction:column;min-width:0}
.plate{font-family:var(--display);background:var(--sign);color:var(--sign-fg);border-radius:6px;padding:4px 10px;font-size:1.1rem;font-variant-numeric:tabular-nums;flex:none;min-width:76px;text-align:center;letter-spacing:.02em;direction:ltr}

.stage{display:flex;align-items:center;gap:10px}
.stage-num{width:28px;height:28px;border-radius:50%;background:var(--fg);color:var(--bg);display:grid;place-items:center;font:600 .9rem var(--body);flex:none}
.loc{font-size:.9rem;border-radius:8px;padding:10px 12px;background:var(--bg);border:1px dashed var(--line)}
.loc.ok{border-style:solid;border-color:var(--ok)}
.loc.warn{border-color:var(--warn)}

label.field{display:flex;flex-direction:column;gap:6px;font-weight:500}
select{padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:inherit}

ol.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
ol.steps li{display:grid;grid-template-columns:28px 1fr;gap:12px;padding-block:12px;border-bottom:1px solid var(--line)}
ol.steps li:last-child{border-bottom:0}
.dot{width:28px;height:28px;border-radius:50%;border:2px solid var(--sign);display:grid;place-items:center;font-size:.8rem;font-weight:600;font-variant-numeric:tabular-nums}
li.arrive .dot{background:var(--sign);color:var(--sign-fg)}
.stepbody{display:flex;flex-direction:column;gap:8px;min-width:0}
.photo{aspect-ratio:4/3;max-width:100%;border-radius:8px;border:1px dashed var(--line);display:grid;place-items:center;color:var(--muted);font-size:.8rem;background:repeating-linear-gradient(135deg,transparent 0 10px,var(--bg) 10px 20px)}
.foot{text-align:center}
.fb{display:flex;flex-direction:column;gap:10px}
.fb-row{display:flex;gap:10px;flex-wrap:wrap}
.fb-row .btn{flex:1 1 140px}
.fb-row .btn svg{width:20px;height:20px}
.btn[aria-pressed="true"]{background:var(--sign);color:var(--sign-fg);border-color:var(--sign)}
.fb-msg{font-size:.9rem}
.fb-msg.ok{color:var(--ok)}
.fb-msg.err{color:var(--warn)}
.report-link{align-self:flex-start}
textarea.field-in,select.field-in,input.field-in{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:inherit}
textarea.field-in{min-height:120px;resize:vertical}
.ctx{font-size:.85rem;color:var(--muted);background:var(--bg);border-radius:8px;padding:8px 10px}
.hp{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.backbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:6px;margin-block:-6px}
.backbtn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--sign);color:var(--sign-fg);border:0;border-radius:999px;padding:11px 20px;font:600 1rem var(--body);cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.backbtn:hover{filter:brightness(1.1)}
.backbtn:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
.backbtn-wide{width:100%;border-radius:12px;padding:14px}
.disclaimer{border:1px solid var(--line);border-inline-start:4px solid var(--muted);background:var(--surface);border-radius:8px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;font-size:.875rem;color:var(--muted)}
.disclaimer h3{font-family:var(--body);font-weight:600;font-size:.9rem;color:var(--fg)}
.disclaimer p:last-child{color:var(--fg);font-weight:500}
.stepper{display:flex;flex-direction:column;gap:12px}
.st-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-size:.85rem;color:var(--muted)}
.st-bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.st-bar>i{display:block;height:100%;background:var(--amber);transition:width .2s}
.st-img{display:block;width:100%;max-width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:12px;border:1px solid var(--line);background:var(--bg)}
.st-text{font-size:1.1rem;font-weight:500;line-height:1.5}
.st-draft{font-size:.75rem;color:var(--muted)}
figure.door{margin:0;display:flex;flex-direction:column;gap:6px}
figure.door img{display:block;width:100%;max-width:100%;max-height:420px;object-fit:cover;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
figure.door figcaption{font-size:.8rem;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.btn,.room,.chip{transition:background-color .15s,border-color .15s}}
.dispbtn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:5px 12px;font:600 .8rem var(--body);cursor:pointer}
.dispbtn svg{width:16px;height:16px}
.dispbtn[aria-expanded="true"]{background:var(--sign);color:var(--sign-fg);border-color:var(--sign)}
.disp{display:flex;flex-direction:column;gap:12px}
.disp h3{font-size:1rem}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{flex:1;border:0;background:var(--surface);color:var(--fg);padding:10px;font:600 1rem var(--body);cursor:pointer}
.seg button+button{border-inline-start:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--sign);color:var(--sign-fg)}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:10px;padding:10px 12px;font:600 .95rem var(--body);cursor:pointer;text-align:start}
.toggle .sw{width:42px;height:24px;border-radius:12px;background:var(--line);position:relative;flex:none}
.toggle .sw::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:18px;height:18px;border-radius:50%;background:var(--surface)}
.toggle[aria-pressed="true"] .sw{background:var(--sign)}
.toggle[aria-pressed="true"] .sw::after{inset-inline-start:21px}
.speak{align-self:flex-start;display:inline-flex;align-items:center;gap:6px}
.speak svg{width:18px;height:18px}
.seg button:focus-visible,.toggle:focus-visible,.dispbtn:focus-visible{outline:3px solid var(--amber);outline-offset:2px}
/* ניגודיות גבוהה: גובר על בהיר וכהה */
html:root[data-contrast="high"]{--bg:#ffffff;--surface:#ffffff;--fg:#000000;--muted:#000000;--line:#000000;--sign:#000000;--sign-fg:#ffffff;--amber:#ffd400;--amber-ink:#000000;--ok:#005a1f;--warn:#7a3b00;color-scheme:light}
html:root[data-contrast="high"] .panel,html:root[data-contrast="high"] .room,html:root[data-contrast="high"] .chip,html:root[data-contrast="high"] .search,html:root[data-contrast="high"] .disclaimer{border-width:2px}
html:root[data-contrast="high"] .linkbtn{color:#000;font-weight:700}
html:root[data-contrast="high"] .note{border:2px solid #000}
html:root[data-contrast="high"] .toggle .sw{background:#fff;border:2px solid #000}
html:root[data-contrast="high"] .toggle .sw::after{background:#000;top:1px}
html:root[data-contrast="high"] .toggle[aria-pressed="true"] .sw{background:#ffd400}
</style>
</head>
<body>
<div class="wrap" id="app" dir="rtl" lang="he">
  <header class="top">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M15.5 8.5l-2 5-5 2 2-5z" fill="#f2b134" stroke="#f2b134"/></svg>
      </div>
      <div style="min-width:0">
        <h1 data-t="title"></h1>
        <p class="muted small" data-t="subtitle"></p>
      </div>
    </div>
    <div class="top-tools">
      <div class="langs" role="group" aria-label="Language / שפה / اللغة">
        <button type="button" class="lang" data-lang="he" lang="he">עב</button>
        <button type="button" class="lang" data-lang="ar" lang="ar">ع</button>
        <button type="button" class="lang" data-lang="en" lang="en">EN</button>
      </div>
      <button type="button" class="dispbtn" id="dispBtn" aria-expanded="false" aria-controls="dispPanel">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20l5-14 5 14"/><path d="M5.8 15h6.4"/><path d="M15 20l3-8 3 8"/><path d="M16 17.5h4"/></svg>
        <span data-t="dispBtn"></span></button>
      <button class="linkbtn" id="toPrivacy" type="button" data-t="privacy"></button>
    </div>
  </header>

  <section class="panel disp" id="dispPanel" hidden aria-labelledby="dispH">
    <h3 id="dispH" data-t="dispTitle"></h3>
    <div>
      <p class="small muted" id="fsLabel" data-t="fsLabel"></p>
      <div class="seg" role="group" aria-labelledby="fsLabel">
        <button type="button" dir="ltr" data-fs="1" style="font-size:1rem">A</button>
        <button type="button" dir="ltr" data-fs="2" style="font-size:1.2rem">A+</button>
        <button type="button" dir="ltr" data-fs="3" style="font-size:1.4rem">A++</button>
      </div>
    </div>
    <button type="button" class="toggle" id="contrastBtn" aria-pressed="false"><span data-t="contrast"></span><span class="sw" aria-hidden="true"></span></button>
    <button type="button" class="toggle" id="autoReadBtn" aria-pressed="false"><span data-t="autoRead"></span><span class="sw" aria-hidden="true"></span></button>
    <p class="small muted" id="noSpeech" hidden data-t="noSpeech"></p>
    <button type="button" class="linkbtn" id="toAccess" style="align-self:flex-start" data-t="accStmt"></button>
  </section>

  <p class="note" data-t="note"></p>

  <button type="button" class="a11y" id="a11y" aria-pressed="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="10" cy="4" r="2" fill="currentColor"/><path d="M10 7v6h6l2 5"/><path d="M10 10h5"/><path d="M7.5 11.2A5 5 0 1 0 14 18"/></svg>
    <span data-t="a11yBtn"></span><span class="sw" aria-hidden="true"></span>
  </button>
  <p class="acc-on" id="accOn" hidden data-t="a11yOn"></p>

  <section id="viewHome" hidden>
    <div style="display:flex;flex-direction:column;gap:12px">
      <label for="q" class="field" data-t="qLabel"></label>
      <input id="q" class="search" type="search" autocomplete="off">
      <div class="chips" id="chips" role="group"></div>
      <div id="groups" style="display:flex;flex-direction:column;gap:14px"></div>
      <p class="muted small" id="emptyMsg" hidden data-t="empty"></p>
    </div>
  </section>

  <section id="viewRoom" hidden>
    <div style="display:flex;flex-direction:column;gap:16px">
      <div class="backbar"><button class="backbtn" id="back" type="button" data-t="back"></button></div>
      <div style="display:flex;align-items:center;gap:14px">
        <span class="plate" id="rPlate"></span>
        <div class="meta" style="min-width:0">
          <h2 id="rName"></h2>
          <p class="muted small" id="rWhere"></p>
        </div>
      </div>
      <p class="note" id="rTip" hidden></p>
      <figure class="door" id="rFig" hidden>
        <img id="rImg" alt="">
        <figcaption data-t="doorCap"></figcaption>
      </figure>
      <div class="panel">
        <h3 data-t="how"></h3>
        <div class="stepper" id="stepper" hidden>
          <div class="st-head"><span id="stFrom"></span><span id="stCount" style="font-variant-numeric:tabular-nums"></span></div>
          <div class="st-bar" aria-hidden="true"><i id="stBar"></i></div>
          <img class="st-img" id="stImg" alt="">
          <div class="photo st-img" id="stNoImg" hidden data-t="noPhoto"></div>
          <p class="st-text" id="stText" aria-live="polite"></p>
          <button type="button" class="btn btn-ghost speak" id="speakBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5L6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>
            <span data-t="speak"></span></button>
          <p class="small muted" id="noVoice" hidden></p>
          <div class="row">
            <button class="btn btn-ghost" id="stPrev" type="button" data-t="prev"></button>
            <button class="btn btn-primary" id="stNext" type="button"></button>
          </div>
          <p class="st-draft" data-t="draft"></p>
          <p class="st-draft" id="stDraftExtra" hidden data-t="accCheck"></p>
        </div>
        <p class="loc" id="indoorPending" hidden data-t="pending"></p>
      </div>

      <div class="panel fb" id="rateBox">
        <h3 data-t="rateQ"></h3>
        <div class="fb-row" id="rateBtns">
          <button type="button" class="btn btn-ghost" id="rateUp" aria-pressed="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 10v11H3V10z"/><path d="M7 10l4-8a3 3 0 0 1 3 3v4h6a2 2 0 0 1 2 2.3l-1.4 8A2 2 0 0 1 18.6 21H7"/></svg>
            <span data-t="rateUp"></span></button>
          <button type="button" class="btn btn-ghost" id="rateDown" aria-pressed="false">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 14V3h4v11z"/><path d="M17 14l-4 8a3 3 0 0 1-3-3v-4H4a2 2 0 0 1-2-2.3l1.4-8A2 2 0 0 1 5.4 3H17"/></svg>
            <span data-t="rateDown"></span></button>
        </div>
        <p class="fb-msg" id="rateMsg" aria-live="polite" hidden></p>
        <button type="button" class="linkbtn report-link" id="reportRoom" data-t="reportRoom"></button>
        <p class="small muted" data-t="mailHint"></p>
        <button type="button" class="linkbtn report-link" id="copyMail" data-t="copyMail"></button>
        <p class="fb-msg" id="copyMsg" aria-live="polite" hidden></p>
      </div>
      <button class="backbtn backbtn-wide" id="back2" type="button" data-t="back"></button>
    </div>
  </section>


  <section id="viewAccess" class="panel" aria-labelledby="accH" hidden>
    <h2 id="accH" data-t="aTitle"></h2>
    <p class="muted small" data-t="aDate"></p>
    <h3 data-t="aDoneH"></h3><p data-t="aDone"></p>
    <h3 data-t="aToolsH"></h3><p data-t="aTools"></p>
    <h3 data-t="aLimitH"></h3><p data-t="aLimit"></p>
    <h3 data-t="aContactH"></h3><p data-t="aContact"></p>
    <button class="btn btn-primary" id="accBack" type="button" data-t="pBack"></button>
  </section>

  <section id="viewPrivacy" class="panel" aria-labelledby="privH" hidden>
    <h2 id="privH" data-t="pTitle"></h2>

const norm = s => (s||"").toLowerCase().replace(/["'״׳\-\s]/g,"");

function buildChips(){

    b.type = "button"; b.className = "chip"; b.textContent = tr(a.name);

function renderList(){
  const q = norm($("q").value), g = $("groups"); g.innerHTML = ""; let total = 0;

    if (areaFilter !== "all" && areaFilter !== a.id) continue;
    const list = DATA.rooms.filter(r => r.area === a.id && (!q || norm(r.plate).includes(q) || norm(allText(r.label)).includes(q) || norm(r.alias).includes(q) || norm(allText(a.name)).includes(q)));
    if (!list.length) continue;
    total += list.length;
    const sec = document.createElement("div"); sec.className = "group";
    sec.innerHTML = `<div class="group-h"><h3></h3><span class="count"></span></div>`;
    sec.querySelector("h3").textContent = tr(a.name);
    sec.querySelector(".count").textContent = tr(UI.nRooms(list.length));
    for (const r of list) {
      const b = document.createElement("button");
      b.type = "button"; b.className = "room";
      b.innerHTML = `<span class="plate"></span><span class="meta"><strong></strong><span class="muted small"></span></span>`;
      b.querySelector(".plate").textContent = r.plate;
      b.querySelector("strong").textContent = tr(titleOf(r));
      const bits = [tr(a.name)];
      if (r.bldg) bits.push(tr(UI.bldg(r.bldg)));
      if (r.floor) bits.push(tr(UI.floor(r.floor))); else if (a.note) bits.push(tr(a.note));
      if (r.photo) bits.push(tr(UI.hasPhoto));
      if (!a11y && r.route) bits.push(tr(UI.hasRoute));
      b.querySelector(".muted").textContent = bits.join(" · ");
      if (a11y) {
        const bd = document.createElement("span");
        bd.className = "small " + (r.accRoute ? "badge-acc" : "badge-noacc");
        bd.textContent = tr(r.accRoute ? UI.accOk : UI.accNone);
        b.querySelector(".meta").appendChild(bd);

  $("stepper").hidden = !rt; $("indoorPending").hidden = !!rt;
  if (!rt) $("indoorPending").textContent = a11y
      ? (r.route ? tr(UI.noAcc) : tr(UI.pending)) + (r.accHint ? " " + tr(UI.noAccLift) : "")
      : tr(UI.pending);
  if (rt) renderStepper();
  $("rateBox").hidden = !rt;
  if (rt) renderRate();
}
function renderStepper(){
  const rt = activeRoute(current), st = rt.steps, n = st.length, s = st[stepIdx], last = stepIdx === n - 1;
  $("stFrom").textContent = (a11y ? "♿ " : "") + tr(UI.from(rt.from));
  $("stDraftExtra").hidden = !a11y || !!current.accOk;
  $("stCount").textContent = tr(UI.stepOf(stepIdx + 1, n));
  $("stBar").style.width = `${(stepIdx + 1) / n * 100}%`;
  $("stImg").hidden = !s.img; $("stNoImg").hidden = !!s.img;
  if (s.img) { $("stImg").src = s.img; $("stImg").alt = tr(s.text); }
  $("stText").textContent = tr(s.text);
  $("stPrev").disabled = stepIdx === 0; $("stPrev").style.visibility = stepIdx === 0 ? "hidden" : "visible";
  $("stNext").textContent = tr(last ? UI.restart : UI.next);
  stopSpeak(); if (prefs.autoRead) speakStep();
  if (!last && st[stepIdx + 1].img) { const im = new Image(); im.src = st[stepIdx + 1].img; }
}
$("stPrev").onclick = () => { if (stepIdx > 0) { stepIdx--; renderStepper(); } };
$("stNext").onclick = () => { const n = activeRoute(current).steps.length; stepIdx = stepIdx < n - 1 ? stepIdx + 1 : 0; renderStepper(); $("stepper").scrollIntoView({block:"start", behavior:"smooth"}); };

/* ===== משוב: נפתח מייל באפליקציית המייל של המשתמש ===== */
const REPORT_TO = "oris@savion.huji.ac.il";
const REPORT_SUBJECT = "דיווח על בעיה באפליקציית מצפן עבודה סוציאלית";
const MAIL_INTRO = {
  report: T("תארו כאן את הבעיה:", "صفوا المشكلة هنا:", "Describe the problem here:"),
  up:     T("אהבתי את המסלול. (אפשר להוסיף הערה)", "أعجبني المسار. (يمكن إضافة ملاحظة)", "I liked this route. (You can add a comment)"),
  down:   T("לא אהבתי את המסלול. מה לא עבד?", "لم يعجبني المسار. ما الذي لم ينجح؟", "I didn't like this route. What didn't work?")
};
function mailContext(withRoom){
  const lines = [];
  if (withRoom && current) {
    const rt = activeRoute(current);
    lines.push(`חדר: ${current.plate}`);
    if (rt) lines.push(`צעד במסלול: ${stepIdx + 1} מתוך ${rt.steps.length}`);
  }
  lines.push(`שפה: ${lang}`, `מצב נגיש: ${a11y ? "כן" : "לא"}`);
  return lines.join("\n");
}
function openMail(kind, withRoom){
  const subject = kind === "report" ? REPORT_SUBJECT
    : `משוב ${kind === "up" ? "אהבתי" : "לא אהבתי"} · אפליקציית מצפן עבודה סוציאלית${withRoom && current ? " · חדר " + current.plate : ""}`;
  const body = `${tr(MAIL_INTRO[kind])}\n\n\n\n----\n${mailContext(withRoom)}`;
  location.href = `mailto:${REPORT_TO}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
}
function msg(el, text, kind){ el.hidden = !text; el.textContent = text || ""; el.className = "fb-msg" + (kind ? " " + kind : ""); }
function renderRate(){
  $("rateUp").setAttribute("aria-pressed", "false"); $("rateDown").setAttribute("aria-pressed", "false");
  msg($("rateMsg"), ""); msg($("copyMsg"), "");
}
function rate(v){
  $(v === "up" ? "rateUp" : "rateDown").setAttribute("aria-pressed", "true");
  msg($("rateMsg"), tr(UI.rateThx), "ok");
  openMail(v, true);
}
$("rateUp").onclick = () => rate("up");
$("rateDown").onclick = () => rate("down");
$("reportRoom").onclick = () => openMail("report", true);
$("reportGeneral").onclick = () => openMail("report", false);
$("copyMail").onclick = () => {
  const done = ok => msg($("copyMsg"), tr(ok ? UI.copied : UI.copyFail), ok ? "ok" : "err");
  try { navigator.clipboard.writeText(REPORT_TO).then(() => done(true), () => done(false)); } catch(e) { done(false); }
};

/* ===== תצוגה ונגישות ===== */
const prefs = { fs: 1, contrast: false, autoRead: false };
try { Object.assign(prefs, JSON.parse(localStorage.getItem("mzp-display") || "{}")); } catch(e) {}
const savePrefs = () => { try { localStorage.setItem("mzp-display", JSON.stringify(prefs)); } catch(e) {} };
const canSpeak = "speechSynthesis" in window && "SpeechSynthesisUtterance" in window;
function applyDisplay(){
  document.documentElement.style.fontSize = ["100%","118%","136%"][prefs.fs - 1] || "100%";
  if (prefs.contrast) document.documentElement.setAttribute("data-contrast","high"); else document.documentElement.removeAttribute("data-contrast");
  document.querySelectorAll("[data-fs]").forEach(b => b.setAttribute("aria-pressed", String(+b.dataset.fs === prefs.fs)));
  $("contrastBtn").setAttribute("aria-pressed", String(prefs.contrast));
  $("autoReadBtn").setAttribute("aria-pressed", String(prefs.autoRead));
  $("autoReadBtn").hidden = !canSpeak; $("noSpeech").hidden = canSpeak; $("speakBtn").hidden = !canSpeak;
  applyVoiceState();
}
document.querySelectorAll("[data-fs]").forEach(b => b.onclick = () => { prefs.fs = +b.dataset.fs; savePrefs(); applyDisplay(); });
$("contrastBtn").onclick = () => { prefs.contrast = !prefs.contrast; savePrefs(); applyDisplay(); };
$("autoReadBtn").onclick = () => { prefs.autoRead = !prefs.autoRead; savePrefs(); applyDisplay(); if (!prefs.autoRead) stopSpeak(); };
$("dispBtn").onclick = () => { const open = $("dispPanel").hidden; $("dispPanel").hidden = !open; $("dispBtn").setAttribute("aria-expanded", String(open)); };
const VOICE_LANG = { he: "he-IL", ar: "ar-SA", en: "en-US" };
let speaking = false;
let voicesKnown = false;
function voiceFor(l){ return canSpeak ? speechSynthesis.getVoices().find(v => v.lang && v.lang.toLowerCase().replace("_","-").startsWith(l)) : null; }
function hasVoice(){ if (!canSpeak) return false; if (!voicesKnown) return true; return !!voiceFor(lang); }
function applyVoiceState(){
  const ok = hasVoice();
  $("speakBtn").hidden = !ok;
  $("noVoice").hidden = !canSpeak || ok;
  $("noVoice").textContent = tr(UI.noVoice);
  $("autoReadBtn").disabled = !ok;
  $("autoReadBtn").style.opacity = ok ? "" : ".5";
}
if (canSpeak) {
  const check = () => { if (speechSynthesis.getVoices().length) { voicesKnown = true; applyVoiceState(); } };
  check(); speechSynthesis.addEventListener?.("voiceschanged", check);
}
function stopSpeak(){ if (canSpeak) speechSynthesis.cancel(); speaking = false; $("speakBtn").querySelector("span").textContent = tr(UI.speak); }
function speakStep(){
  if (!canSpeak || !current || !hasVoice()) return;
  const rt = activeRoute(current); if (!rt) return;
  const u = new SpeechSynthesisUtterance(tr(rt.steps[stepIdx].text));
  u.lang = VOICE_LANG[lang];
  const v = voiceFor(lang);
  if (v) u.voice = v; else if (voicesKnown) { applyVoiceState(); return; }
  u.onend = u.onerror = () => { speaking = false; $("speakBtn").querySelector("span").textContent = tr(UI.speak); };
  speechSynthesis.cancel(); speechSynthesis.speak(u);
  speaking = true; $("speakBtn").querySelector("span").textContent = tr(UI.stopSpeak);
}
$("speakBtn").onclick = () => speaking ? stopSpeak() : speakStep();
const openAccess = () => { lastView = currentView(); stopSpeak(); show("viewAccess"); };
$("toAccess").onclick = $("toAccess2").onclick = openAccess;
$("accBack").onclick = () => { if (lastView === "viewRoom" && current) openRoom(current); else show("viewHome"); };
applyDisplay();

applyLang();
show("viewHome");
</script>
</body>
</html>
